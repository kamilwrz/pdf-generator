name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # TestClient starts the FastAPI lifespan; allow a non-production secret.
      SECRET_KEY: ci-test-secret-key-32chars-min
      ALGORITHM: HS256
      ALLOW_UNPAID_PLAN_SELECTION: "true"
      ALLOW_INSECURE_SECRET: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Audit Python production dependencies
        run: python -m pip_audit --requirement requirements.txt --strict
      - name: Run backend tests
        run: python -m pytest -q

  postgres-security-contracts:
    name: PostgreSQL security contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pdfgenerator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pdfgenerator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret-key-32chars-min
      ALGORITHM: HS256
      ALLOW_INSECURE_SECRET: "false"
      POSTGRES_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pdfgenerator_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Validate documentation links and EN/PL structure
        working-directory: .
        run: python .github/scripts/check_documentation.py
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Require the isolated PostgreSQL test URL
        run: test -n "$POSTGRES_TEST_DATABASE_URL"
      - name: Run PostgreSQL bootstrap and concurrency contracts
        run: python -m pytest -q -rs tests/test_postgres_security_contracts.py

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Exercise the production-only HTTPS contract without contacting a live API.
      VITE_API_URL: https://api.example.test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: List discovered unit tests
        run: npm test -- --list
      - name: Run unit tests
        run: npm test
      - name: Run React runtime tests
        run: npm run test:runtime
      - name: Run lint
        run: npm run lint -- --max-warnings 0
      - name: Build production bundle
        run: npm run build
      - name: Enforce gzip bundle budgets
        run: npm run check:bundle

  frontend-e2e:
    name: Frontend Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run local mocked-API smoke tests
        run: npm run test:e2e

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
